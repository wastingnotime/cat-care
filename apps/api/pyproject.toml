[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-care-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=7,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
