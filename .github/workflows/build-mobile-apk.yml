name: Build offline Android APK
on:
  push:
    paths: ['apps/mobile/**', 'contracts/mobile.md', '.github/workflows/build-mobile-apk.yml']
  pull_request:
    paths: ['apps/mobile/**', 'contracts/mobile.md', '.github/workflows/build-mobile-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: SQLite tests on Android 35
        run: |
          sdkmanager 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd -n cat-care -k 'system-images;android-35;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd cat-care -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader > /tmp/cat-care-emulator.log 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable
          adb shell svc data disable
          ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cat-care-offline-debug-apk
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            apps/mobile/app/build/reports/
            apps/mobile/app/build/outputs/androidTest-results/
